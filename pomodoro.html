<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomodoro — Agenda Matheus</title>
<style>
  :root{
    --bg:#0e1116;
    --panel:#161b22;
    --line:#242c38;
    --txt:#e6edf3;
    --dim:#8b98a8;
    --foco:#e5534b;
    --curta:#3fb950;
    --longa:#3d8bfd;
    --accent:var(--foco);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    background:var(--bg);color:var(--txt);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;-webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:520px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:26px 24px 22px;text-align:center;
  }
  .modes{display:flex;gap:6px;justify-content:center;margin-bottom:22px}
  .modes button{
    flex:1;padding:9px 4px;border:1px solid var(--line);background:transparent;
    color:var(--dim);border-radius:9px;font-size:12.5px;font-weight:600;
    cursor:pointer;transition:.15s;font-family:inherit;
  }
  .modes button:hover{color:var(--txt);border-color:#39424f}
  .modes button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .time{
    font-size:76px;font-weight:700;letter-spacing:-2px;line-height:1;
    font-variant-numeric:tabular-nums;margin:4px 0 6px;
    transition:color .3s;color:var(--accent);
  }
  .label{color:var(--dim);font-size:13px;margin-bottom:20px;min-height:18px}
  .label b{color:var(--txt);font-weight:600}
  .bar{height:4px;background:#0b0e13;border-radius:99px;overflow:hidden;margin-bottom:22px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s linear}
  .ctrls{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
  .ctrls button{
    padding:13px 0;border-radius:10px;font-size:14px;font-weight:700;
    cursor:pointer;font-family:inherit;border:1px solid var(--line);transition:.15s;
  }
  #go{flex:2;background:var(--accent);border-color:var(--accent);color:#fff}
  #go:hover{filter:brightness(1.12)}
  #reset,#skip{flex:1;background:transparent;color:var(--dim)}
  #reset:hover,#skip:hover{color:var(--txt);border-color:#39424f}
  .dots{display:flex;gap:7px;justify-content:center;align-items:center;margin-bottom:20px;min-height:12px;flex-wrap:wrap}
  .dot{width:10px;height:10px;border-radius:50%;background:#232c38;transition:.2s}
  .dot.done{background:var(--foco)}
  .dot.now{background:var(--foco);box-shadow:0 0 0 3px rgba(229,83,75,.25)}
  .divider{height:1px;background:var(--line);margin:4px 0 18px}
  .blocos-t{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin-bottom:10px;font-weight:700}
  .blocos{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .blocos button{
    padding:7px 11px;border-radius:99px;border:1px solid var(--line);
    background:transparent;color:var(--dim);font-size:11.5px;cursor:pointer;
    font-family:inherit;transition:.15s;font-weight:500;
  }
  .blocos button:hover{color:var(--txt);border-color:#39424f;background:#1b2129}
  .blocos button.on{border-color:var(--accent);color:var(--txt);background:rgba(229,83,75,.12)}
  .foot{margin-top:18px;font-size:11.5px;color:#5c6875;line-height:1.6}
  @media(max-width:420px){.time{font-size:58px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="modes">
      <button data-mode="foco" class="on">Foco · 25</button>
      <button data-mode="curta">Pausa · 5</button>
      <button data-mode="longa">Pausa longa · 15</button>
    </div>

    <div class="time" id="time">25:00</div>
    <div class="label" id="label">Pronto pra começar</div>
    <div class="bar"><i id="bar"></i></div>

    <div class="ctrls">
      <button id="go">INICIAR</button>
      <button id="skip">Pular</button>
      <button id="reset">Zerar</button>
    </div>

    <div class="dots" id="dots"></div>

    <div class="divider"></div>
    <div class="blocos-t">Blocos da sua agenda</div>
    <div class="blocos" id="blocos">
      <button data-p="1">🛡️ Almoço · 1</button>
      <button data-p="2">🎓 Faculdade · 2</button>
      <button data-p="2">🏭 LypsyOS · 2</button>
      <button data-p="1">🇬🇧 Inglês · 1</button>
      <button data-p="6">🧪 Sábado lab · 6</button>
      <button data-p="4">🧪 Domingo · 4</button>
      <button data-p="2">🔁 Revisão · 2</button>
    </div>

    <div class="foot">
      Pausa longa a cada 4 pomodoros.<br>
      Se o bloco acabar antes dos pomodoros, tudo bem — o que conta é ter começado no horário.
    </div>
  </div>
</div>

<script>
(function(){
  var DUR = { foco:25*60, curta:5*60, longa:15*60 };
  var NOME = { foco:"Foco", curta:"Pausa curta", longa:"Pausa longa" };
  var COR  = { foco:"var(--foco)", curta:"var(--curta)", longa:"var(--longa)" };

  var mode = "foco", left = DUR.foco, running = false, tick = null;
  var doneCount = 0, meta = 4, tocados = 0;

  var $t = document.getElementById("time"),
      $l = document.getElementById("label"),
      $b = document.getElementById("bar"),
      $go = document.getElementById("go"),
      $dots = document.getElementById("dots"),
      $root = document.documentElement;

  function fmt(s){
    var m = Math.floor(s/60), r = s%60;
    return (m<10?"0":"")+m+":"+(r<10?"0":"")+r;
  }

  function paintDots(){
    $dots.innerHTML = "";
    for(var i=0;i<meta;i++){
      var d = document.createElement("div");
      d.className = "dot" + (i<doneCount ? " done" : (i===doneCount && mode==="foco" ? " now" : ""));
      $dots.appendChild(d);
    }
  }

  function render(){
    $t.textContent = fmt(left);
    $t.style.color = COR[mode];
    $root.style.setProperty("--accent", COR[mode]);
    var pct = 100 - (left / DUR[mode] * 100);
    $b.style.width = pct + "%";
    document.title = (running ? fmt(left)+" · " : "") + NOME[mode] + " — Pomodoro";
    paintDots();
  }

  function setMode(m, keepCount){
    mode = m; left = DUR[m]; stop();
    if(!keepCount && m === "foco"){ /* mantém contagem */ }
    document.querySelectorAll(".modes button").forEach(function(b){
      b.classList.toggle("on", b.dataset.mode === m);
    });
    $l.textContent = m === "foco"
      ? "Pomodoro " + Math.min(doneCount+1, meta) + " de " + meta
      : "Levanta, bebe água, olha longe.";
    render();
  }

  function beep(times){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      var ctx = new Ctx();
      for(var i=0;i<times;i++){
        var o = ctx.createOscillator(), g = ctx.createGain();
        var t0 = ctx.currentTime + i*0.42;
        o.type = "sine";
        o.frequency.setValueAtTime(mode==="foco"?880:660, t0);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.28, t0+0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t0+0.35);
        o.connect(g); g.connect(ctx.destination);
        o.start(t0); o.stop(t0+0.4);
      }
    }catch(e){}
  }

  function flash(){
    var n = 0, orig = document.body.style.background;
    var iv = setInterval(function(){
      document.body.style.background = (n%2===0) ? "#1c1216" : orig;
      if(++n > 7){ clearInterval(iv); document.body.style.background = orig; }
    }, 260);
  }

  function stop(){
    running = false; clearInterval(tick); tick = null;
    $go.textContent = left === DUR[mode] ? "INICIAR" : "CONTINUAR";
  }

  function finish(){
    stop(); beep(3); flash();
    if(mode === "foco"){
      doneCount++;
      if(doneCount >= meta){
        $l.innerHTML = "<b>Bloco completo.</b> " + meta + " pomodoros. Marque ✅ Feito no Notion.";
        setMode("longa", true);
        doneCount = 0;
      }else{
        $l.innerHTML = "<b>Pomodoro " + doneCount + " feito.</b> Pausa de 5.";
        setMode(doneCount % 4 === 0 ? "longa" : "curta", true);
      }
    }else{
      $l.innerHTML = "<b>Pausa acabou.</b> Volta pro foco.";
      setMode("foco", true);
    }
  }

  function start(){
    if(running){ stop(); $l.textContent = "Pausado — volta quando quiser."; return; }
    running = true;
    $go.textContent = "PAUSAR";
    $l.textContent = mode === "foco"
      ? "Pomodoro " + Math.min(doneCount+1, meta) + " de " + meta + " — celular longe."
      : "Descansando.";
    beep(1);
    tick = setInterval(function(){
      left--;
      if(left <= 0){ left = 0; render(); finish(); return; }
      render();
    }, 1000);
    render();
  }

  $go.addEventListener("click", start);

  document.getElementById("reset").addEventListener("click", function(){
    stop(); left = DUR[mode]; doneCount = 0;
    $l.textContent = "Zerado. Recomeça quando quiser.";
    render();
  });

  document.getElementById("skip").addEventListener("click", function(){
    left = 0; finish();
  });

  document.querySelectorAll(".modes button").forEach(function(b){
    b.addEventListener("click", function(){ setMode(b.dataset.mode, true); });
  });

  document.querySelectorAll("#blocos button").forEach(function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll("#blocos button").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      meta = parseInt(b.dataset.p, 10);
      doneCount = 0;
      setMode("foco", true);
      $l.innerHTML = "Bloco carregado: <b>" + meta + " pomodoro" + (meta>1?"s":"") + "</b>. Dá o play no horário.";
    });
  });

  document.addEventListener("keydown", function(e){
    if(e.code === "Space"){ e.preventDefault(); start(); }
  });

  render();
})();
</script>
</body>
</html>
